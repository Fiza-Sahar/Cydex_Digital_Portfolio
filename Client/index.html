    <!-- Dark Theme Lock (Clean up any old theme storage) -->

      (function() {
        try {
          localStorage.removeItem('cydex_theme');
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
